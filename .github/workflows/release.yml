name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            pkg-config \
            patchelf \
            libssl-dev \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - run: npm ci

      # A tag builds both a .deb and an AppImage.
      - name: Build Tauri bundles
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: src-tauri/target/release/bundle

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: bundles

      - name: Stage release assets
        run: |
          mkdir -p release
          find bundles -type f \( -name "*.deb" -o -name "*.AppImage" \) -exec cp {} release/ \;
          (
            cd release
            for deb in *.deb; do
              [ -e "$deb" ] && sha256sum "$deb" > "$deb.sha256"
            done
          )
          ls -lh release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" --repo "${{ github.repository }}" --generate-notes release/*
          fi
