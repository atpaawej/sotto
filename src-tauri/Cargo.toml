[package]
name = "sotto"
version = "0.1.0"
description = "Hold a key, speak, and clean text lands where your cursor is."
edition = "2021"
rust-version = "1.82"

[lib]
name = "sotto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
